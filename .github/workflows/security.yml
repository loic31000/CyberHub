name: Security and maintainability
on:
  pull_request:
  push:
    branches: [chore/security-ci-pilot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    uses: loic31000/security-ci/.github/workflows/security-audit.yml@e0328b13cb7eb7fb69f294fe303f9d83143f52b0
    with:
      enforce: false
      # Infrastructure-only smoke tests; NOT CyberHub application coverage.
      test_command: |
        python -m pip install coverage==7.10.7
        mkdir -p "$RUNNER_TEMP/ci-audit-smoke"
        cat > "$RUNNER_TEMP/ci-audit-smoke/smoke.py" <<'PY'
        def add(a, b):
            return a + b

        assert add(2, 3) == 5
        PY
        python -m coverage run --source="$RUNNER_TEMP/ci-audit-smoke" "$RUNNER_TEMP/ci-audit-smoke/smoke.py"
        python -m coverage xml -o coverage.xml
        python -m coverage report --fail-under=100
      coverage_paths: coverage.xml
