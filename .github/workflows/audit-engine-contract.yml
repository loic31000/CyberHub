name: Audit engine contract tests
on:
  push:
    branches: [chore/security-ci-pilot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine_contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audited engine revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: loic31000/security-ci
          ref: c852c7482af6ee8590dc66281de4d814750ee0f3
          persist-credentials: false
          path: audit-engine
      - name: Exercise real SARIF decision logic
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import textwrap

          workflow = Path("audit-engine/.github/workflows/security-audit.yml").read_text()
          marker = "      - name: Résumé et décision\n"
          section = workflow.split(marker, 1)[1].split("      - name: Conserver le rapport\n", 1)[0]
          raw = section.split("          python3 - <<'PY'\n", 1)[1].split("          PY\n", 1)[0]
          code = textwrap.dedent(raw)

          def check(case, payload, outcome, enforce, expected):
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  if payload is not None:
                      (root / "semgrep.sarif").write_text(payload)
                  summary = root / "summary.md"
                  env = dict(os.environ, SCANNER="semgrep", REPORT_DIR=str(root),
                             ENFORCE=str(enforce).lower(), SCAN_OUTCOME=outcome,
                             TRIVY_OUTCOME="", GITHUB_STEP_SUMMARY=str(summary))
                  result = subprocess.run(["python3", "-c", code], env=env, capture_output=True, text=True)
                  if result.returncode != expected or not summary.exists():
                      raise AssertionError(f"{case}: exit={result.returncode} expected={expected}; stderr={result.stderr}")
                  print(f"PASS {case}: exit={result.returncode}")

          clean = json.dumps({"version":"2.1.0","runs":[{"results":[]}]})
          finding = json.dumps({"version":"2.1.0","runs":[{"results":[{"ruleId":"test-rule"}]}]})
          scanner_error = json.dumps({"version":"2.1.0","runs":[{"results":[],"invocations":[{"executionSuccessful":False}]}]})
          notification_error = json.dumps({"version":"2.1.0","runs":[{"results":[],"invocations":[{"toolExecutionNotifications":[{"level":"error"}]}]}]})
          for enforce in (False, True):
              check(f"clean enforce={enforce}", clean, "success", enforce, 0)
              check(f"missing enforce={enforce}", None, "success", enforce, 1)
              check(f"invalid-json enforce={enforce}", "{not JSON", "success", enforce, 1)
              check(f"invalid-runs enforce={enforce}", '{"runs":[]}', "success", enforce, 1)
              check(f"scanner-exit enforce={enforce}", clean, "failure", enforce, 1)
              check(f"invocation-error enforce={enforce}", scanner_error, "success", enforce, 1)
              check(f"notification-error enforce={enforce}", notification_error, "success", enforce, 1)
          check("findings reporting", finding, "success", False, 0)
          check("findings strict", finding, "success", True, 1)
          PY
