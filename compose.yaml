services:
  cyber-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyber-hub:latest
    ports:
      - "127.0.0.1:7743:7743"

    volumes:
      # Persistance de la base SQLite, des sauvegardes et du verrou d'instance
      - cyber-hub-data:/data

    restart: unless-stopped

volumes:
  cyber-hub-data:
