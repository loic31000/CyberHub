 <text x="76" y="827" font-family="monospace" font-size="15" letter-spacing="2" fill="#2644d8">03 / SIX DISCIPLINES, SIX ÉCRITURES</text>
 <g font-family="monospace" font-size="16" fill="#0b1420">
