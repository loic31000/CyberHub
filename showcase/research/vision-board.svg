<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
 <title id="title">Recherche visuelle CyberHub : l'atlas déployable</title>
 <desc id="desc">Planche originale du logo plié, de la typographie, des couleurs, des six expressions de domaines et des états de commandes.</desc>
 <defs>
  <pattern id="smallgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9fa6aa" opacity=".2"/></pattern>
  <pattern id="lines" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#0b1420" opacity=".35"/></pattern>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#0b1420"/></pattern>
 </defs>
 <rect width="1600" height="1120" fill="#ecece4"/>
 <rect x="40" y="35" width="1520" height="1050" fill="none" stroke="#0b1420" stroke-width="2"/>
 <text x="76" y="83" font-family="monospace" font-size="18" letter-spacing="3" fill="#2644d8">CYBERHUB / ÉTUDE 06</text>
 <text x="1524" y="83" text-anchor="end" font-family="monospace" font-size="16" fill="#0b1420">IDENTITÉ · OCT 2026</text>
 <line x1="76" x2="1524" y1="105" y2="105" stroke="#0b1420"/>
 <text x="76" y="166" font-family="Georgia, serif" font-style="italic" font-size="54" fill="#0b1420">L'atlas déployable</text>
 <text x="77" y="199" font-family="Arial, sans-serif" font-size="17" fill="#42505b">Un instrument pour ouvrir, situer et relier les savoirs cyber.</text>
 <line x1="76" x2="1524" y1="233" y2="233" stroke="#0b1420"/>
 <text x="76" y="271" font-family="monospace" font-size="15" letter-spacing="2" fill="#2644d8">01 / EMBLÈME &amp; WORDMARK</text>
 <g transform="translate(78 305)">
  <path d="M0 20L76 0L152 24V133L77 158L0 134Z" fill="#2644d8"/>
  <path d="M76 0V158M0 20L76 44L152 24" stroke="#ecece4" stroke-width="5" fill="none"/>
  <path d="M29 66V113L53 120M101 113L124 106V58" fill="none" stroke="#ecece4" stroke-width="8" stroke-linecap="square"/>
  <circle cx="77" cy="80" r="8" fill="#ecece4"/>
 </g>
 <text x="268" y="375" font-family="Georgia,serif" font-size="68" fill="#0b1420">Cyber<tspan font-style="italic" fill="#2644d8">Hub</tspan></text>
 <text x="272" y="415" font-family="monospace" font-size="17" letter-spacing="3" fill="#0b1420">RENDRE VISIBLE L'INVISIBLE</text>
 <text x="1022" y="292" font-family="monospace" font-size="14" fill="#42505b">RÈGLE DU SIGNE</text>
 <path d="M1030 329L1112 307L1194 333V447L1112 471L1030 445Z" fill="none" stroke="#2644d8" stroke-width="3"/>
 <path d="M1112 307V471M1030 329L1112 353L1194 333" fill="none" stroke="#2644d8" stroke-width="3"/>
 <text x="1225" y="360" font-family="Arial,sans-serif" font-size="18" fill="#0b1420">Trois plans, un centre.</text>
 <text x="1225" y="393" font-family="Arial,sans-serif" font-size="17" fill="#42505b">Le signe s'ouvre ;</text>
 <text x="1225" y="422" font-family="Arial,sans-serif" font-size="17" fill="#42505b">il ne tourne pas en radar.</text>
 <line x1="76" x2="1524" y1="500" y2="500" stroke="#0b1420"/>
 <text x="76" y="539" font-family="monospace" font-size="15" letter-spacing="2" fill="#2644d8">02 / VOIX, ÉCHELLE, COULEUR</text>
 <text x="76" y="606" font-family="Georgia,serif" font-size="51" fill="#0b1420">Voir le système</text>
 <text x="76" y="662" font-family="Georgia,serif" font-size="51" font-style="italic" fill="#2644d8">dans ses détails.</text>
 <text x="76" y="707" font-family="Arial,sans-serif" font-size="22" fill="#0b1420">Une idée en phrase ; une action en mots simples.</text>
 <text x="76" y="741" font-family="monospace" font-size="16" fill="#42505b">TACTIQUE / TECHNIQUE / SOURCE · T1059</text>
 <g transform="translate(925 560)">
